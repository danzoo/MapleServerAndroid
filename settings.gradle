pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    // The machine-wide init.gradle injects the aliyun mirrors as project repositories; this
    // project used to reject those outright, so no build of it could start at all here.
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "MapleServer"
include ':app'
